apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-omc-nestjs-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-omc-nestjs-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 # Escalará cuando el uso promedio de CPU de los pods supere el 50%
  # También puedes escalar por memoria descomentando lo siguiente:
  # - type: Resource
  #   resource:
  #     name: memory
  #     target:
  #       type: Utilization
  #       averageUtilization: 70
